<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="60" y="62" font-size="34" font-weight="bold" fill="#16202a" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Ping protocol and the acoustic slot</text>
<text x="60" y="96" font-size="18" font-weight="normal" fill="#5b6a74" text-anchor="start" font-family="Arial, Helvetica, sans-serif">whack/protocol.py · firmware/src/main.cpp · UDP over a phone hotspot, WM2 messages</text>
<rect x="90" y="130" width="220" height="62" rx="10" fill="#eef1f4" stroke="#374151" stroke-width="2.5"/>
<text x="200" y="160" font-size="20" font-weight="bold" fill="#16202a" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Laptop</text>
<text x="200" y="182" font-size="14" font-weight="normal" fill="#5b6a74" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">UDP 4210</text>
<line x1="200" y1="192" x2="200" y2="640" stroke="#374151" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="580" y="130" width="220" height="62" rx="10" fill="#eef1f4" stroke="#374151" stroke-width="2.5"/>
<text x="690" y="160" font-size="20" font-weight="bold" fill="#16202a" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Box (ESP32)</text>
<text x="690" y="182" font-size="14" font-weight="normal" fill="#5b6a74" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">UDP 4211</text>
<line x1="690" y1="192" x2="690" y2="640" stroke="#374151" stroke-width="1.5" stroke-dasharray="5 5"/>
<path d="M202,245 L688,245" fill="none" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
<text x="445.0" y="235" font-size="17" font-weight="bold" fill="#16202a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">AIM  seq, bearing</text>
<path d="M688,395 L202,395" fill="none" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
<text x="445.0" y="385" font-size="17" font-weight="bold" fill="#16202a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">READY  seq, lease 1000 ms</text>
<path d="M202,470 L688,470" fill="none" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
<text x="445.0" y="460" font-size="17" font-weight="bold" fill="#16202a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">FIRE  seq</text>
<path d="M688,600 L202,600" fill="none" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
<text x="445.0" y="590" font-size="17" font-weight="bold" fill="#16202a" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">RANGE  mm, OK / TIMEOUT / INVALID, age</text>
<rect x="682" y="250" width="16" height="140" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<rect x="682" y="475" width="16" height="120" rx="3" fill="#dcf0f3" stroke="#0e8a9b" stroke-width="1.5"/>
<text x="712" y="285" font-size="15" font-weight="normal" fill="#5b6a74" text-anchor="start" font-family="Arial, Helvetica, sans-serif">servo ramp ≥ 150 °/s</text>
<text x="712" y="306" font-size="15" font-weight="normal" fill="#5b6a74" text-anchor="start" font-family="Arial, Helvetica, sans-serif">settle 60 ms + ramp</text>
<text x="712" y="327" font-size="15" font-weight="normal" fill="#5b6a74" text-anchor="start" font-family="Arial, Helvetica, sans-serif">at most 700 ms</text>
<text x="712" y="348" font-size="15" font-weight="normal" fill="#5b6a74" text-anchor="start" font-family="Arial, Helvetica, sans-serif">bearing outside travel</text>
<text x="712" y="369" font-size="15" font-weight="normal" fill="#5b6a74" text-anchor="start" font-family="Arial, Helvetica, sans-serif">→ refused at once</text>
<text x="712" y="505" font-size="15" font-weight="normal" fill="#5b6a74" text-anchor="start" font-family="Arial, Helvetica, sans-serif">TRIG 10 µs</text>
<text x="712" y="526" font-size="15" font-weight="normal" fill="#5b6a74" text-anchor="start" font-family="Arial, Helvetica, sans-serif">pulseIn ≤ 25 ms (≈ 4.3 m)</text>
<text x="712" y="547" font-size="15" font-weight="normal" fill="#5b6a74" text-anchor="start" font-family="Arial, Helvetica, sans-serif">d = t·343 / 2</text>
<text x="712" y="568" font-size="15" font-weight="normal" fill="#5b6a74" text-anchor="start" font-family="Arial, Helvetica, sans-serif">20–4000 mm else INVALID</text>
<rect x="60" y="672" width="840" height="190" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="76" y="700" font-size="16" font-weight="bold" fill="#16202a" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Every retry is safe over lossy UDP</text>
<text x="76" y="724" font-size="16" font-weight="normal" fill="#16202a" text-anchor="start" font-family="Arial, Helvetica, sans-serif">AIM resent every 0.3 s until READY arrives</text>
<text x="76" y="746" font-size="16" font-weight="normal" fill="#16202a" text-anchor="start" font-family="Arial, Helvetica, sans-serif">duplicate FIRE → cached RANGE replayed, never a second ping</text>
<text x="76" y="768" font-size="16" font-weight="normal" fill="#16202a" text-anchor="start" font-family="Arial, Helvetica, sans-serif">FIRE outside the lease or &lt; 65 ms after the last ping → INVALID</text>
<text x="76" y="790" font-size="16" font-weight="normal" fill="#16202a" text-anchor="start" font-family="Arial, Helvetica, sans-serif">32-bit sequence numbers, only newer accepted (wrap-safe)</text>
<text x="76" y="812" font-size="16" font-weight="normal" fill="#16202a" text-anchor="start" font-family="Arial, Helvetica, sans-serif">before retries: calibration aborted 3 times in 20 steps</text>
<text x="960" y="160" font-size="22" font-weight="bold" fill="#16202a" text-anchor="start" font-family="Arial, Helvetica, sans-serif">One acoustic slot at a time</text>
<text x="960" y="186" font-size="16" font-weight="normal" fill="#5b6a74" text-anchor="start" font-family="Arial, Helvetica, sans-serif">servos move together, pings never overlap</text>
<text x="960" y="256" font-size="17" font-weight="bold" fill="#16202a" text-anchor="start" font-family="Consolas, 'Courier New', monospace">box 0</text>
<rect x="1040" y="230" width="500" height="38" rx="4" fill="#eef1f4" stroke="none" stroke-width="0"/>
<rect x="1040.0" y="230" width="41.66666666666667" height="38" rx="4" fill="#0891b2" stroke="none" stroke-width="0"/>
<rect x="1083.6666666666667" y="230" width="106.33333333333334" height="38" rx="4" fill="#b8c4cc" stroke="none" stroke-width="0"/>
<text x="960" y="318" font-size="17" font-weight="bold" fill="#16202a" text-anchor="start" font-family="Consolas, 'Courier New', monospace">box 1</text>
<rect x="1040" y="292" width="500" height="38" rx="4" fill="#eef1f4" stroke="none" stroke-width="0"/>
<rect x="1206.6666666666667" y="292" width="41.66666666666667" height="38" rx="4" fill="#0891b2" stroke="none" stroke-width="0"/>
<rect x="1250.3333333333335" y="292" width="106.33333333333334" height="38" rx="4" fill="#b8c4cc" stroke="none" stroke-width="0"/>
<text x="960" y="380" font-size="17" font-weight="bold" fill="#16202a" text-anchor="start" font-family="Consolas, 'Courier New', monospace">box 2</text>
<rect x="1040" y="354" width="500" height="38" rx="4" fill="#eef1f4" stroke="none" stroke-width="0"/>
<rect x="1373.3333333333335" y="354" width="41.66666666666667" height="38" rx="4" fill="#0891b2" stroke="none" stroke-width="0"/>
<rect x="1417.0000000000002" y="354" width="106.33333333333334" height="38" rx="4" fill="#b8c4cc" stroke="none" stroke-width="0"/>
<line x1="1040.0" y1="414" x2="1040.0" y2="424" stroke="#5b6a74" stroke-width="1.5"/>
<text x="1040.0" y="444" font-size="15" font-weight="normal" fill="#5b6a74" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">0.0 s</text>
<line x1="1206.6666666666667" y1="414" x2="1206.6666666666667" y2="424" stroke="#5b6a74" stroke-width="1.5"/>
<text x="1206.6666666666667" y="444" font-size="15" font-weight="normal" fill="#5b6a74" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">0.1 s</text>
<line x1="1373.3333333333335" y1="414" x2="1373.3333333333335" y2="424" stroke="#5b6a74" stroke-width="1.5"/>
<text x="1373.3333333333335" y="444" font-size="15" font-weight="normal" fill="#5b6a74" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">0.2 s</text>
<line x1="1540.0" y1="414" x2="1540.0" y2="424" stroke="#5b6a74" stroke-width="1.5"/>
<text x="1540.0" y="444" font-size="15" font-weight="normal" fill="#5b6a74" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">0.3 s</text>
<line x1="1040" y1="414" x2="1540" y2="414" stroke="#5b6a74" stroke-width="1.5"/>
<rect x="960" y="470" width="22" height="16" rx="3" fill="#0891b2" stroke="none" stroke-width="0"/>
<text x="992" y="484" font-size="16" font-weight="normal" fill="#16202a" text-anchor="start" font-family="Arial, Helvetica, sans-serif">ping + echo ≤ 25 ms</text>
<rect x="1200" y="470" width="22" height="16" rx="3" fill="#b8c4cc" stroke="none" stroke-width="0"/>
<text x="1232" y="484" font-size="16" font-weight="normal" fill="#16202a" text-anchor="start" font-family="Arial, Helvetica, sans-serif">65 ms guard (+10 ms poll)</text>
<rect x="960" y="515" width="590" height="120" rx="8" fill="#e9eef2" stroke="none" stroke-width="0"/>
<text x="980" y="552" font-size="19" font-weight="normal" fill="#16202a" text-anchor="start" font-family="Consolas, 'Courier New', monospace">T_slot = 25 + 65 + 10 ms ≈ 0.10 s</text>
<text x="980" y="584" font-size="19" font-weight="normal" fill="#16202a" text-anchor="start" font-family="Consolas, 'Courier New', monospace">T_step = 3 boxes × 0.10 s = 0.30 s</text>
<text x="980" y="614" font-size="16" font-weight="normal" fill="#5b6a74" text-anchor="start" font-family="Consolas, 'Courier New', monospace">lost reply: wait lease + 25 ms + 65 ms</text>
<rect x="960" y="672" width="590" height="190" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="976" y="700" font-size="16" font-weight="bold" fill="#16202a" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Why one slot</text>
<text x="976" y="724" font-size="16" font-weight="normal" fill="#16202a" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Two HC-SR04s pinging together hear each</text>
<text x="976" y="746" font-size="16" font-weight="normal" fill="#16202a" text-anchor="start" font-family="Arial, Helvetica, sans-serif">other's echoes and report a false range.</text>
<text x="976" y="768" font-size="16" font-weight="normal" fill="#16202a" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Cost: step rate is set by the schedule, not</text>
<text x="976" y="790" font-size="16" font-weight="normal" fill="#16202a" text-anchor="start" font-family="Arial, Helvetica, sans-serif">the servo, so faster recovery needs bigger</text>
<text x="976" y="812" font-size="16" font-weight="normal" fill="#16202a" text-anchor="start" font-family="Arial, Helvetica, sans-serif">search steps, not faster servos.</text>
</svg>