<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="60" y="62" font-size="34" font-weight="bold" fill="#1f2937">Laptop state machine — per-box servo mode</text>
<text x="60" y="96" font-size="18" fill="#4b5563">whack/swarm.py · each box runs this independently; the laptop picks its next bearing every poll</text>
<circle cx="70" cy="300" r="13" fill="#1f2937"/>
<path d="M83,300 L118,300" fill="none" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="120" y="230" width="320" height="140" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="280.0" y="264" font-size="24" font-weight="bold" fill="#1f2937" text-anchor="middle">Sweep</text>
<text x="280.0" y="292" font-size="16" fill="#4b5563" text-anchor="middle">5° steps across own arc</text>
<text x="280.0" y="314" font-size="16" fill="#4b5563" text-anchor="middle">bounce at arc ends</text>
<text x="280.0" y="336" font-size="16" fill="#4b5563" text-anchor="middle">1 ping per bearing</text>
<text x="280.0" y="358" font-size="16" fill="#4b5563" text-anchor="middle">candidate → repeat once</text>
<rect x="640" y="230" width="320" height="140" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
<text x="800.0" y="264" font-size="24" font-weight="bold" fill="#1f2937" text-anchor="middle">Aimed</text>
<text x="800.0" y="292" font-size="16" fill="#4b5563" text-anchor="middle">point at shared estimate</text>
<text x="800.0" y="314" font-size="16" fill="#4b5563" text-anchor="middle">(any box's fix)</text>
<text x="800.0" y="336" font-size="16" fill="#4b5563" text-anchor="middle">re-aim every ping</text>
<text x="800.0" y="358" font-size="16" fill="#4b5563" text-anchor="middle">lead 80 ms</text>
<rect x="1180" y="230" width="320" height="140" rx="18" fill="#fce7f3" stroke="#db2777" stroke-width="3"/>
<text x="1340.0" y="264" font-size="24" font-weight="bold" fill="#1f2937" text-anchor="middle">Jitter</text>
<text x="1340.0" y="292" font-size="16" fill="#4b5563" text-anchor="middle">dither 0, +8°, −8°</text>
<text x="1340.0" y="314" font-size="16" fill="#4b5563" text-anchor="middle">round aimed bearing</text>
<text x="1340.0" y="336" font-size="16" fill="#4b5563" text-anchor="middle">for up to 1.0 s</text>
<rect x="640" y="620" width="320" height="140" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
<text x="800.0" y="654" font-size="24" font-weight="bold" fill="#1f2937" text-anchor="middle">Search</text>
<text x="800.0" y="682" font-size="16" fill="#4b5563" text-anchor="middle">after full loss (0.5 s)</text>
<text x="800.0" y="704" font-size="16" fill="#4b5563" text-anchor="middle">start at game's expect()</text>
<text x="800.0" y="726" font-size="16" fill="#4b5563" text-anchor="middle">15° steps, middle first</text>
<text x="800.0" y="748" font-size="16" fill="#4b5563" text-anchor="middle">out to both arc ends</text>
<path d="M440,275 L638,275" fill="none" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
<text x="539" y="230" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">Fix accepted</text>
<text x="539" y="250" font-size="16" fill="#1f2937" text-anchor="middle">(this or other box)</text>
<path d="M640,330 L442,330" fill="none" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
<text x="539" y="360" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">Estimate stale</text>
<text x="539" y="380" font-size="16" fill="#1f2937" text-anchor="middle">&gt; 0.5 s</text>
<path d="M960,275 L1178,275" fill="none" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
<text x="1069" y="255" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">Aimed ping missed</text>
<path d="M1180,330 L962,330" fill="none" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
<text x="1069" y="360" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">Fix accepted</text>
<path d="M760,230 C760,170 840,170 840,228" fill="none" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
<text x="860" y="190" font-size="16" fill="#1f2937" text-anchor="start">Hit: re-aim at new fix</text>
<path d="M1340,230 L1340,150 L280,150 L280,228" fill="none" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
<text x="810" y="138" font-size="16" fill="#1f2937" text-anchor="middle">1.0 s with no hit → back to Sweep, 2 s cooldown before re-aim (unless estimate moved ≥ 0.3 m)</text>
<path d="M280,370 L280,690 L638,690" fill="none" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
<text x="295" y="520" font-size="16" fill="#1f2937" text-anchor="start" font-weight="bold">Player lost</text>
<text x="295" y="540" font-size="16" fill="#1f2937" text-anchor="start">no fix 0.5 s</text>
<text x="295" y="560" font-size="16" fill="#1f2937" text-anchor="start">(all boxes)</text>
<path d="M1340,370 L1340,690 L962,690" fill="none" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
<text x="1355" y="520" font-size="16" fill="#1f2937" text-anchor="start" font-weight="bold">Player lost</text>
<text x="1355" y="540" font-size="16" fill="#1f2937" text-anchor="start">no fix 0.5 s</text>
<path d="M800,370 L800,618" fill="none" stroke="#374151" stroke-width="2.5" marker-end="url(#a)" stroke-dasharray="8 6"/>
<text x="785" y="500" font-size="16" fill="#1f2937" text-anchor="end">Player lost</text>
<path d="M640,740 L200,740 L200,372" fill="none" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
<text x="420" y="770" font-size="16" fill="#1f2937" text-anchor="middle">Both arc ends done → Sweep</text>
<path d="M880,618 L880,372" fill="none" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
<text x="895" y="450" font-size="16" fill="#1f2937" text-anchor="start" font-weight="bold">Fix accepted</text>
<rect x="1060" y="790" width="500" height="80" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="1076" y="818" font-size="16" fill="#1f2937" font-weight="bold">Calibrating overrides all modes:</text>
<text x="1076" y="840" font-size="16" fill="#1f2937">fixed plan, every bearing × 3 pings</text>
</svg>