[platformio]
; Build names match box positions. The laptop numbers boxes left to right by x,
; so with three boxes: left = 0, middle = 1, right = 2.
; A two-box layout has no middle box: its right box is node 1 (node_right_pair).
default_envs = node_left, node_middle, node_right

[env]
platform = espressif32@7.0.1
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
; 460800, the board default, fails on the ELEGOO CP2102 boards ("Unable to verify flash chip connection")
upload_speed = 115200
build_flags = -Wall -Wextra
; main.cpp is the WM2 AIM/FIRE firmware; lockscan_main.cpp is the lock-scan
; sketch node (lock_* environments below). A build takes one of them.
build_src_filter = +<*> -<lockscan_main.cpp>

[env:node_left]
build_flags = ${env.build_flags} -DNODE_ID=0

[env:node_middle]
build_flags = ${env.build_flags} -DNODE_ID=1

[env:node_right]
build_flags = ${env.build_flags} -DNODE_ID=2

[env:node_right_pair]
build_flags = ${env.build_flags} -DNODE_ID=1

; Lock-scan sketch nodes: the SEARCH/TRACK sketch runs on the box unchanged and
; reports to the laptop (python3 -m whack --tracker sketch). NODE_ID per position
; as above.
[env:lock_left]
build_flags = ${env.build_flags} -DNODE_ID=0
build_src_filter = +<lockscan_main.cpp>
lib_deps = madhephaestus/ESP32Servo@^3.0

[env:lock_middle]
build_flags = ${env.build_flags} -DNODE_ID=1
build_src_filter = +<lockscan_main.cpp>
lib_deps = madhephaestus/ESP32Servo@^3.0

[env:lock_right]
build_flags = ${env.build_flags} -DNODE_ID=2
build_src_filter = +<lockscan_main.cpp>
lib_deps = madhephaestus/ESP32Servo@^3.0
